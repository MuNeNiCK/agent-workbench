[package]
name = "agent-workbench"
version = "0.1.34"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
unicode-normalization = "0.1"
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
