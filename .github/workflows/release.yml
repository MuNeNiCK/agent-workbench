name: release-observer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  observe-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify source
        run: |
          set -eu
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Verify identity and public contract
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          test "$(git describe --tags --exact-match HEAD)" = "$tag"
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)" = "$version"
          test "$(sed -n '1{s/[[:space:]]//g;p;}' skills/agent-workbench/CLI_VERSION)" = "$tag"
          cargo build --locked
          scripts/check-public-contract.sh

      - name: Rebuild deterministic candidate assets
        run: |
          set -eu
          scripts/build-release-assets.sh "$GITHUB_REF_NAME" "$PWD/dist"
          test "$(tar -tzf "dist/agent-workbench-${GITHUB_REF_NAME}-linux-x86_64.tar.gz")" = agent-workbench
          if tar -tzf "dist/agent-workbench-${GITHUB_REF_NAME}-skill.tar.gz" | grep -E '(^|/)\.agent-workbench/|(^|/)\.agents/' ; then exit 1; fi
          if tar -tzf "dist/agent-workbench-${GITHUB_REF_NAME}-docs.tar.gz" | grep -E '(^|/)\.agent-workbench/|(^|/)\.agents/' ; then exit 1; fi

      - name: Exercise candidate wrapper
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          candidate="$RUNNER_TEMP/agent-workbench-candidate"
          project="$candidate/project"
          mkdir -p "$candidate/binary" "$candidate/skill" "$project"
          tar -xzf "dist/agent-workbench-${tag}-linux-x86_64.tar.gz" -C "$candidate/binary"
          tar -xzf "dist/agent-workbench-${tag}-skill.tar.gz" -C "$candidate/skill"
          binary="$candidate/binary/agent-workbench"
          wrapper="$candidate/skill/agent-workbench/scripts/agent-workbench.sh"
          chmod +x "$binary" "$wrapper"
          test "$(AGENT_WORKBENCH_BIN="$binary" "$wrapper" --version)" = "agent-workbench ${tag#v}"
          AGENT_WORKBENCH_BIN="$binary" "$wrapper" --root "$project" init
          AGENT_WORKBENCH_BIN="$binary" "$wrapper" --root "$project" status | grep -Fx initialized >/dev/null
          AGENT_WORKBENCH_BIN="$binary" "$wrapper" review run add --help >/dev/null
          AGENT_WORKBENCH_BIN="$binary" "$wrapper" review adjudicate --help >/dev/null
          AGENT_WORKBENCH_BIN="$binary" "$wrapper" finding decide --help >/dev/null
          AGENT_WORKBENCH_BIN="$binary" "$wrapper" verification adjudicate --help >/dev/null
          work_id="$(AGENT_WORKBENCH_BIN="$binary" "$wrapper" --root "$project" work start 'release exercise' | sed -n 's/^work_unit_id: //p')"
          policy_id="$(AGENT_WORKBENCH_BIN="$binary" "$wrapper" --root "$project" review policy add --name release-exercise --type implementation_review | sed -n 's/^review_policy_id: //p')"
          plan_id="$(AGENT_WORKBENCH_BIN="$binary" "$wrapper" --root "$project" review plan add --work-unit "$work_id" --type implementation_review --stage close-ready --required --policy "$policy_id" | sed -n 's/^review_plan_id: //p')"
          run_id="$(AGENT_WORKBENCH_BIN="$binary" "$wrapper" --root "$project" review run add --plan "$plan_id" --type fresh --purpose new_unbiased_review --clean --provenance external_agent --provenance-ref release-exercise:review --external-agent-id release-exercise-agent | sed -n 's/^review_run_id: //p')"
          AGENT_WORKBENCH_BIN="$binary" "$wrapper" --root "$project" review adjudicate "$run_id" --decision accepted --reason 'release exercise accepted' --expected-current pending >/dev/null
          AGENT_WORKBENCH_BIN="$binary" "$wrapper" --root "$project" review plan list | grep -F ':clean required=true]' >/dev/null
          scripts/check-release-ledger-compatibility.sh "$binary"

      - name: Confirm observer-only boundary
        run: git diff --exit-code
