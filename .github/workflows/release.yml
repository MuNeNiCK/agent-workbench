name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: false
          build-args: "--wfail"
      - name: Verify tag and installed workflow
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
          test "$(.lake/build/bin/agent-workbench --version)" = \
            "agent-workbench ${GITHUB_REF_NAME#v}"
          lake test
      - uses: docker/setup-buildx-action@v3
      - name: Build static Linux executable
        uses: docker/build-push-action@v6
        with:
          context: .
          file: release/linux-x86_64-static.Dockerfile
          target: artifact
          outputs: type=local,dest=${{ runner.temp }}/static
          cache-from: type=gha,scope=lean-4.30.0-musl
          cache-to: type=gha,mode=max,scope=lean-4.30.0-musl
      - name: Build portable formal tool
        uses: docker/build-push-action@v6
        with:
          context: .
          file: release/linux-x86_64-static.Dockerfile
          target: formal-tool-artifact
          outputs: type=local,dest=${{ runner.temp }}/formal
          cache-from: type=gha,scope=lean-4.30.0-musl
          cache-to: type=gha,mode=max,scope=lean-4.30.0-musl
      - name: Build release assets
        run: |
          chmod +x "$RUNNER_TEMP/static/agent-workbench"
          scripts/build-release-assets.sh "$GITHUB_REF_NAME" "$PWD/dist" \
            "$RUNNER_TEMP/static/agent-workbench" \
            "$RUNNER_TEMP/formal/agent-workbench-formal-tool"
          mkdir "$RUNNER_TEMP/verify"
          tar -xzf \
            "$PWD/dist/agent-workbench-$GITHUB_REF_NAME-linux-x86_64-static.tar.gz" \
            -C "$RUNNER_TEMP/verify"
          scripts/test-release-binary.sh \
            "$RUNNER_TEMP/verify/agent-workbench"
      - name: Validate installed formal route without host glibc
        run: |
          docker run --rm \
            -e GITHUB_REF_NAME \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/static:/runtime:ro" \
            -v "$PWD/dist:/dist:ro" \
            -w /src \
            alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -ec '
              apk add --no-cache coreutils curl git sqlite tar util-linux
              scripts/test-skill.sh /runtime/agent-workbench \
                "/dist/agent-workbench-$GITHUB_REF_NAME-formal-tool-linux-x86_64.tar.gz"
            '
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
