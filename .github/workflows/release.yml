name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: false
          build-args: "--wfail"
      - name: Verify tagged source
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
          test "$(.lake/build/bin/agent-workbench --version)" = \
            "agent-workbench ${GITHUB_REF_NAME#v}"
          lake test
          scripts/test-skill.sh .lake/build/bin/agent-workbench
      - name: Build and validate release asset
        run: |
          scripts/build-release-assets.sh "$GITHUB_REF_NAME" "$PWD/dist" \
            .lake/build/bin/agent-workbench
          mkdir "$RUNNER_TEMP/verify"
          tar -xzf \
            "$PWD/dist/agent-workbench-$GITHUB_REF_NAME-linux-x86_64.tar.gz" \
            -C "$RUNNER_TEMP/verify"
          scripts/test-release-binary.sh \
            "$RUNNER_TEMP/verify/agent-workbench"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
