name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: false
          build-args: "--wfail"
      - name: Verify tag and laws
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
          test "$(.lake/build/bin/agent-workbench --version)" = \
            "agent-workbench ${GITHUB_REF_NAME#v}"
          .lake/build/bin/kernel-laws
          .lake/build/bin/storage-laws
          .lake/build/bin/workflow-laws
          .lake/build/bin/cli-laws
      - name: Build release assets
        run: scripts/build-release-assets.sh "$GITHUB_REF_NAME" "$PWD/dist"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
