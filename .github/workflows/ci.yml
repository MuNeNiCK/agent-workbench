name: ci

on:
  push:
    branches: [lean]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: false
          build-args: "--wfail"
      - name: Run executable laws
        run: |
          .lake/build/bin/kernel-laws
          .lake/build/bin/storage-laws
          .lake/build/bin/workflow-laws
          .lake/build/bin/cli-laws
          scripts/test-skill-product.sh .lake/build/bin/agent-workbench
      - name: Check release tooling
        run: |
          shellcheck scripts/build-release-assets.sh
          shellcheck scripts/test-release-binary.sh
          shellcheck scripts/test-skill-product.sh
          shellcheck scripts/fixtures/curl-release.sh
          shellcheck skills/agent-workbench/scripts/agent-workbench.sh

  static-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build static Linux executable
        uses: docker/build-push-action@v6
        with:
          context: .
          file: release/linux-x86_64-static.Dockerfile
          target: artifact
          outputs: type=local,dest=${{ runner.temp }}/static
          cache-from: type=gha,scope=lean-4.30.0-musl
          cache-to: type=gha,mode=max,scope=lean-4.30.0-musl
      - name: Validate packaged static executable
        run: |
          chmod +x "$RUNNER_TEMP/static/agent-workbench"
          scripts/build-release-assets.sh v0.2.1 "$RUNNER_TEMP/dist" \
            "$RUNNER_TEMP/static/agent-workbench"
          mkdir "$RUNNER_TEMP/verify"
          tar -xzf \
            "$RUNNER_TEMP/dist/agent-workbench-v0.2.1-linux-x86_64-static.tar.gz" \
            -C "$RUNNER_TEMP/verify"
          scripts/test-release-binary.sh \
            "$RUNNER_TEMP/verify/agent-workbench"
