name: CI

on:
  push:
    branches: [lean]
  pull_request:
    branches: [lean]
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-15-intel
          - runner: macos-15
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Build native targets
        shell: bash
        run: lake build agent-workbench agent-workbench-tests agent-workbench-proof-tests
      - name: Verify pinned BLAKE3 sources
        shell: bash
        run: |
          test "$(git -C .lake/packages/Blake3 rev-parse HEAD)" = d815da486b97afae97f8c1f76f17260e3db5b075
          test "$(git -C .lake/packages/Blake3/blake3 rev-parse HEAD)" = 8b829b697fa4cfe35de35e9aa8c20b56266cb091
      - name: Run domain and native integration tests
        shell: bash
        run: .lake/build/bin/agent-workbench-tests${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Run isolated proof-build integration tests
        shell: bash
        run: .lake/build/bin/agent-workbench-proof-tests${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Check bootstrap script syntax
        if: runner.os != 'Windows'
        run: sh -n skills/agent-workbench/scripts/setup.sh

  required:
    if: always()
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native target
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
